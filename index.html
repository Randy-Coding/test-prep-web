<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Prep</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main class="shell">
    <nav class="site-nav" aria-label="Main navigation"><span class="nav-brand">Test Prep<span class="dot">.</span></span><div class="nav-links"><button id="nav-home" class="nav-link active" type="button">Home</button><button id="nav-exam" class="nav-link" type="button">Practice Test</button><button id="nav-flashcards" class="nav-link" type="button">Flashcards</button></div></nav>
    <header id="hero"><span class="eyebrow">STUDY SPACE</span><h1>Test Prep<span class="dot">.</span></h1><p>Pick what to study, then work through a fresh mix of questions.</p></header>
    <section id="setup" class="card">
      <div class="section-title"><span class="step">01</span><div><h2>Build your session</h2><p>Questions are shuffled each time.</p></div></div>
      <label>Study method</label><div class="mode-picker"><button id="exam-mode" class="mode active" type="button">Exam <small>Reveal and self-grade</small></button><button id="flash-mode" class="mode" type="button">Flashcards <small>Flip and browse</small></button></div>
      <label for="bank">Question bank</label><select id="bank"></select>
      <div class="topic-heading"><label>Chapters / topics</label><button id="toggle-topics" class="text-button" type="button">Select all</button></div>
      <div id="topics" class="topics"></div>
      <div id="chunk-options"><label for="chunk-size">Questions per chunk <span class="hint">Optional</span></label>
      <input id="chunk-size" type="number" min="1" placeholder="Leave blank to use every selected question">
      <div id="chunks-wrap" hidden><label>Choose chunks</label><div id="chunks" class="topics"></div></div></div>
      <p id="setup-error" class="error" role="alert"></p>
      <div class="actions"><span id="question-count"></span><button id="start" class="primary" type="button">Start exam →</button></div>
    </section>
    <section id="exam" class="card" hidden>
      <div class="exam-top"><span id="progress"></span><span id="score"></span></div>
      <div class="progress-track"><div id="progress-fill"></div></div>
      <p class="eyebrow">QUESTION</p><div id="question" class="question"></div>
      <button id="reveal" class="primary" type="button">Reveal answer</button>
      <div id="answer-panel" hidden><p class="eyebrow">ANSWER</p><div id="answer" class="answer"></div><p class="grade-label">Did you get it right?</p><div class="grade-actions"><button id="incorrect" class="secondary" type="button">Not yet</button><button id="correct" class="primary" type="button">Yes, I did</button></div></div>
    </section>
    <section id="results" class="card" hidden><span class="eyebrow">SESSION COMPLETE</span><h2 id="result-title"></h2><p id="result-score"></p><div id="missed"></div><div class="grade-actions"><button id="restart" class="secondary" type="button">New session</button><button id="retry" class="primary" type="button">Retry missed questions</button></div></section>
    <section id="flashcards" class="card" hidden>
      <div class="exam-top"><span id="card-progress"></span><button id="back-setup" class="text-button" type="button">Change chapters</button></div>
      <button id="flash-card" class="flash-card" type="button" aria-label="Show answer"><span class="flash-card-inner"><span class="flash-face flash-front"><span class="eyebrow">QUESTION</span><span id="card-question" class="card-content"></span><span class="flip-hint">Click to flip</span></span><span class="flash-face flash-back"><span class="eyebrow">ANSWER</span><span id="card-answer" class="card-content"></span><span class="flip-hint">Click to flip back</span></span></span></button>
      <div class="flash-actions"><button id="previous-card" class="secondary" type="button">← Previous</button><button id="shuffle-cards" class="secondary" type="button">Shuffle</button><button id="next-card" class="primary" type="button">Next →</button></div>
    </section>
  </main>
</body>
</html>
